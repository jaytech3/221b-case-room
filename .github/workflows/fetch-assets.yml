name: Fetch public-domain assets

# Manually triggered helper: searches Wikimedia Commons, or downloads a chosen
# list of files, resizes them with ImageMagick and commits them to assets/.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "search | fetch"
        required: true
        default: "search"
      payload:
        description: "JSON — search: [\"query\", ...]  fetch: [{title, out, w, h, gravity}]"
        required: true
        default: "[]"

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          cat > /tmp/assets.py <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request, subprocess, re
          UA = {"User-Agent": "221b-case-room-asset-fetcher/1.0 (https://github.com/jaytech3/221b-case-room; contact via GitHub issues)"}
          API = "https://commons.wikimedia.org/w/api.php"
          MET = "https://collectionapi.metmuseum.org/public/collection/v1"
          def get(url, tries=2):
              for i in range(tries):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=25).read()
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 503) and i < tries - 1: time.sleep(3); continue
                      raise
          def api(params):
              params.update(format="json"); time.sleep(1.2)
              return json.loads(get(API + "?" + urllib.parse.urlencode(params)))
          def meta(page):
              ii = page.get("imageinfo", [{}])[0]; em = ii.get("extmetadata", {})
              g = lambda k: re.sub("<[^>]+>", "", em.get(k, {}).get("value", "")).strip()
              return dict(title=page["title"], w=ii.get("width"), h=ii.get("height"), url=ii.get("url"),
                          thumb=ii.get("thumburl"), license=g("LicenseShortName"), artist=g("Artist")[:80],
                          date=g("DateTimeOriginal")[:40], desc=g("ImageDescription")[:140])
          def met_obj(oid):
              return json.loads(get(f"{MET}/objects/{oid}"))
          AIC = "https://api.artic.edu/api/v1/artworks/search"
          CMA = "https://openaccess-api.clevelandart.org/api/artworks/"
          LOC = "https://www.loc.gov/photos/"
          mode, payload = os.environ["MODE"], json.loads(os.environ["PAYLOAD"])
          def p(*a): print(*a, flush=True)
          if mode == "search":
              for q in payload:
                  src, q = (q.split(":", 1) + [""])[:2] if ":" in q else ("aic", q)
                  p("\n=== " + src + ": " + q)
                  try:
                      if src == "aic":
                          u = AIC + "?" + urllib.parse.urlencode({"q": q, "query[term][is_public_domain]": "true", "fields": "id,title,artist_display,date_display,image_id,medium_display,classification_title", "limit": 16})
                          for d in json.loads(get(u)).get("data", []):
                              if not d.get("image_id"): continue
                              p(f'aic | {d["title"][:70]} | {(d.get("artist_display") or "")[:50].replace(chr(10)," ")} | {d.get("date_display","")} | {(d.get("medium_display") or "")[:40]} | https://www.artic.edu/iiif/2/{d["image_id"]}/full/1686,/0/default.jpg | https://www.artic.edu/artworks/{d["id"]}')
                      elif src == "cma":
                          u = CMA + "?" + urllib.parse.urlencode({"q": q, "cc0": 1, "has_image": 1, "limit": 16})
                          for d in json.loads(get(u)).get("data", []):
                              im = (d.get("images") or {}).get("web") or {}
                              if not im.get("url"): continue
                              p(f'cma | {d["title"][:70]} | {", ".join(c.get("description","") for c in d.get("creators", []))[:50]} | {d.get("creation_date","")} | {(d.get("technique") or "")[:40]} | {im["url"]} | {d.get("url","")}')
                      elif src == "loc":
                          u = LOC + "?" + urllib.parse.urlencode({"q": q, "fo": "json", "c": 16})
                          for d in json.loads(get(u)).get("results", []):
                              ims = d.get("image_url") or []
                              if not ims: continue
                              p(f'loc | {d.get("title","")[:70]} | {", ".join(d.get("contributor") or [])[:40]} | {d.get("date","")} | {", ".join(d.get("original_format") or [])[:30]} | {ims[-1]} | {d.get("id","")} | rights: {(d.get("rights") or "")[:60] if isinstance(d.get("rights"), str) else ""}')
                      else:
                          raw = get(API + "?" + urllib.parse.urlencode(dict(action="query", generator="search", gsrsearch=q, gsrnamespace=6, gsrlimit=12, prop="imageinfo", iiprop="url|size|extmetadata", iiurlwidth=640, format="json")))
                          r = json.loads(raw)
                          if "query" not in r: p("RAW", raw[:300]); continue
                          for pg in sorted(r["query"].get("pages", {}).values(), key=lambda x: x.get("index", 0)):
                              m = meta(pg)
                              if not m["url"]: continue
                              p(f'commons | {m["title"]} | {m["w"]}x{m["h"]} | {m["license"]} | {m["artist"]} | {m["date"]} | {m["url"]}')
                          time.sleep(2)
                  except Exception as e:
                      p("ERR", repr(e)[:200])
          else:
              os.makedirs("assets", exist_ok=True)
              credits = ["# Image credits\n\n", "All photographs are public-domain / CC0 works from open-access museum and library collections, lightly cropped, resized and toned for the board.\n\n"]
              for item in payload:
                  src, cred = item["url"], item.get("credit", "")
                  tmp = "/tmp/src_" + re.sub(r"\W", "_", item["out"])
                  try:
                      open(tmp, "wb").write(get(src))
                      out = os.path.join("assets", item["out"]); os.makedirs(os.path.dirname(out), exist_ok=True)
                      w, h, grav = item.get("w", 900), item.get("h", 1125), item.get("gravity", "north")
                      subprocess.run(["convert", tmp + "[0]", "-auto-orient", "-strip", "-resize", f"{w}x{h}^", "-gravity", grav, "-extent", f"{w}x{h}", "-quality", "82", out], check=True)
                      p(f'OK {out} {os.path.getsize(out)//1024}KB <- {cred}')
                      credits.append(f'- `{item["out"]}` — {cred}\n')
                  except Exception as e:
                      p("FAIL", item["out"], repr(e)[:200])
              open("assets/CREDITS.md", "w").write("".join(credits))
          PY
          python3 /tmp/assets.py
      - name: Commit
        if: inputs.mode == 'fetch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add public-domain photographs from Wikimedia Commons (see assets/CREDITS.md)" || echo "nothing to commit"
          git push
