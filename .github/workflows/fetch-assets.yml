name: Fetch public-domain assets

# Manually triggered helper: searches Wikimedia Commons, or downloads a chosen
# list of files, resizes them with ImageMagick and commits them to assets/.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "search | fetch"
        required: true
        default: "search"
      payload:
        description: "JSON — search: [\"query\", ...]  fetch: [{title, out, w, h, gravity}]"
        required: true
        default: "[]"

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          cat > /tmp/assets.py <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request, subprocess, re
          UA = {"User-Agent": "221b-case-room-asset-fetcher/1.0 (https://github.com/jaytech3/221b-case-room; contact via GitHub issues)"}
          API = "https://commons.wikimedia.org/w/api.php"
          MET = "https://collectionapi.metmuseum.org/public/collection/v1"
          def get(url, tries=5):
              for i in range(tries):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=90).read()
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 503) and i < tries - 1: time.sleep(4 * (i + 1)); continue
                      raise
          def api(params):
              params.update(format="json"); time.sleep(1.2)
              return json.loads(get(API + "?" + urllib.parse.urlencode(params)))
          def meta(page):
              ii = page.get("imageinfo", [{}])[0]; em = ii.get("extmetadata", {})
              g = lambda k: re.sub("<[^>]+>", "", em.get(k, {}).get("value", "")).strip()
              return dict(title=page["title"], w=ii.get("width"), h=ii.get("height"), url=ii.get("url"),
                          thumb=ii.get("thumburl"), license=g("LicenseShortName"), artist=g("Artist")[:80],
                          date=g("DateTimeOriginal")[:40], desc=g("ImageDescription")[:140])
          def met_obj(oid):
              return json.loads(get(f"{MET}/objects/{oid}"))
          mode, payload = os.environ["MODE"], json.loads(os.environ["PAYLOAD"])
          if mode == "search":
              for q in payload:
                  src, q = (q.split(":", 1) + [""])[:2] if ":" in q else ("met", q)
                  print("\n=== " + src + ": " + q, flush=True)
                  try:
                      if src == "met":
                          r = json.loads(get(f"{MET}/search?" + urllib.parse.urlencode(dict(q=q, hasImages="true", departmentId=19))))
                          for oid in (r.get("objectIDs") or [])[:14]:
                              o = met_obj(oid)
                              if not o.get("isPublicDomain") or not o.get("primaryImage"): continue
                              print(f'met:{oid} | {o.get("title","")[:70]} | {o.get("artistDisplayName","")[:40]} | {o.get("objectDate","")} | {o.get("medium","")[:40]} | {o.get("primaryImageSmall","")}', flush=True)
                      else:
                          r = api(dict(action="query", generator="search", gsrsearch=q, gsrnamespace=6, gsrlimit=12,
                                       prop="imageinfo", iiprop="url|size|extmetadata", iiurlwidth=640))
                          for p in sorted(r.get("query", {}).get("pages", {}).values(), key=lambda p: p.get("index", 0)):
                              m = meta(p)
                              if not m["url"] or not re.search(r"\.(jpe?g|png|tiff?)$", m["url"], re.I): continue
                              print(f'{m["title"]} | {m["w"]}x{m["h"]} | {m["license"]} | {m["artist"]} | {m["date"]} | {m["desc"]}', flush=True)
                  except Exception as e:
                      print("ERR", repr(e)[:200], flush=True)
          else:
              os.makedirs("assets", exist_ok=True)
              credits = ["# Image credits\n\n", "All photographs are public-domain works, lightly cropped, resized and toned for the board.\n\n"]
              for item in payload:
                  if "met" in item:
                      o = met_obj(item["met"]); src = o["primaryImage"]
                      cred = f'[{o.get("title","")}](https://www.metmuseum.org/art/collection/search/{item["met"]}) · {o.get("artistDisplayName") or "unknown"} · {o.get("objectDate","")} · The Met, Open Access (CC0)'
                  else:
                      r = api(dict(action="query", titles=item["title"], prop="imageinfo", iiprop="url|size|extmetadata", iiurlwidth=item.get("src_w", 1800)))
                      page = next(iter(r["query"]["pages"].values())); m = meta(page); src = m["thumb"] or m["url"]
                      cred = f'[{m["title"][5:]}](https://commons.wikimedia.org/wiki/{urllib.parse.quote(m["title"].replace(" ", "_"))}) · {m["artist"] or "unknown"} · {m["date"]} · {m["license"]}'
                  if not src: print("MISSING", item); continue
                  tmp = "/tmp/src_" + re.sub(r"\W", "_", item["out"])
                  open(tmp, "wb").write(get(src))
                  out = os.path.join("assets", item["out"]); os.makedirs(os.path.dirname(out), exist_ok=True)
                  w, h, grav = item.get("w", 900), item.get("h", 1125), item.get("gravity", "north")
                  subprocess.run(["convert", tmp + "[0]", "-auto-orient", "-strip", "-resize", f"{w}x{h}^", "-gravity", grav, "-extent", f"{w}x{h}", "-quality", "82", out], check=True)
                  print(f'OK {out} {os.path.getsize(out)//1024}KB <- {cred}', flush=True)
                  credits.append(f'- `{item["out"]}` — {cred}\n')
              open("assets/CREDITS.md", "w").write("".join(credits))
          PY
          python3 /tmp/assets.py
      - name: Commit
        if: inputs.mode == 'fetch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add public-domain photographs from Wikimedia Commons (see assets/CREDITS.md)" || echo "nothing to commit"
          git push
